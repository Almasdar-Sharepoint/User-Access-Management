name: SPFx DEV CI/CD

on:
  push:
    branches:
      - Dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: DEV

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'
          cache: 'npm'

      - name: Verify DEV Client ID
        shell: bash
        run: |
          if [ -z "$CLIENT_ID" ]; then
            echo "CLIENT_ID is NOT available"
            exit 1
          else
            echo "CLIENT_ID is available"
          fi
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}

      - name: Generate DEV config
        shell: bash
        run: |
          cat > src/webparts/userAccessManagement/config.ts <<EOF
          export const appConfig = {
            clientId: "${CLIENT_ID}"
          };
          EOF
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}


      - name: Install dependencies
        run: npm ci

      - name: Build SPFx solution
        run: npx gulp bundle

      - name: Package SPFx solution
        run: npx gulp package-solution --ship

      - name: Upload SPFx package
        uses: actions/upload-artifact@v4
        with:
          name: user-access-management-dev
          path: solution/user-access-management.sppkg

