name: SPFx DEV CI/CD
 
on:

  push:

    branches:

      - Dev
 
  workflow_dispatch:
 
jobs:
 
  # ========================================================

  # BUILD

  # ========================================================

  build:

    runs-on: ubuntu-latest
 
    permissions:

      contents: read
 
    steps:
 
      - name: Checkout code

        uses: actions/checkout@v4
 
      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version: '16.20.2'

          cache: 'npm'
 
      # ----------------------------------------------------

      # SPFx Client ID

      # ----------------------------------------------------

      - name: Verify DEV Client ID

        shell: bash

        run: |

          if [ -z "$CLIENT_ID" ]; then

            echo "CLIENT_ID is NOT available"

            exit 1

          else

            echo "CLIENT_ID is available"

          fi

        env:

          CLIENT_ID: ${{ secrets.CLIENT_ID }}
 
      # ----------------------------------------------------

      # Generate config.ts

      # ----------------------------------------------------

      - name: Generate DEV config

        shell: bash

        run: |

          cat > src/webparts/userAccessManagement/config.ts <<EOF

          export const appConfig = {

            clientId: "${CLIENT_ID}"

          };

          EOF

        env:

          CLIENT_ID: ${{ secrets.CLIENT_ID }}
 
      - name: Verify generated config

        shell: bash

        run: |

          if grep -q 'clientId: ""' src/webparts/userAccessManagement/config.ts; then

            echo "ERROR: Client ID was not generated"

            exit 1

          else

            echo "DEV config contains a Client ID"

          fi
 
      # ----------------------------------------------------

      # Install dependencies

      # ----------------------------------------------------

      - name: Install dependencies

        run: npm ci
 
      # ----------------------------------------------------

      # Build

      # ----------------------------------------------------

      - name: Build SPFx solution

        run: npx gulp bundle
 
      # ----------------------------------------------------

      # Package

      # ----------------------------------------------------

      - name: Package SPFx solution

        run: npx gulp package-solution --ship
 
      # ----------------------------------------------------

      # Upload artifact

      # ----------------------------------------------------

      - name: Upload SPFx package

        uses: actions/upload-artifact@v4

        with:

          name: spfx-package

          path: sharepoint/solution/user-access-management.sppkg
 
 
  # ========================================================

  # DEPLOY DEV

  # ========================================================

  deploy-dev:

    needs: build

    runs-on: ubuntu-latest
 
    environment: DEV
 
    permissions:

      contents: read
 
    steps:
 
      # ----------------------------------------------------

      # Download package

      # ----------------------------------------------------

      - name: Download SPFx package

        uses: actions/download-artifact@v4

        with:

          name: spfx-package

          path: sharepoint/solution
 
      # ----------------------------------------------------

      # Setup Node.js

      # ----------------------------------------------------

      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version: '20'
 
      # ----------------------------------------------------

      # Install deployment dependencies

      # ----------------------------------------------------

      - name: Install deployment dependencies

        run: |

          npm install @azure/identity axios
 
      # ----------------------------------------------------

      # Create deployment script

      # ----------------------------------------------------

      - name: Create SharePoint deployment script

        shell: bash

        run: |

          cat > deploy-spfx.js <<'EOF'
 
          const { ClientSecretCredential } = require("@azure/identity");

          const axios = require("axios");

          const fs = require("fs");
 
          const tenantId = process.env.AZURE_TENANT_ID;

          const clientId = process.env.AZURE_CLIENT_ID;

          const clientSecret = process.env.AZURE_CLIENT_SECRET;

          const appCatalogUrl = process.env.SP_APP_CATALOG_URL;
 
          const packagePath =

            "./sharepoint/solution/user-access-management.sppkg";
 
          async function main() {
 
            console.log("Starting SPFx deployment...");
 
            console.log("Client ID:", clientId);

            console.log("Tenant ID:", tenantId);

            console.log("App Catalog:", appCatalogUrl);
 
            if (!fs.existsSync(packagePath)) {

              throw new Error(

                `SPFx package not found: ${packagePath}`

              );

            }
 
            const credential = new ClientSecretCredential(

              tenantId,

              clientId,

              clientSecret

            );
 
            /*

             * SharePoint hostname

             *

             * Example:

             * https://contoso.sharepoint.com/sites/MySite

             */
 
            const sharePointUrl =

              new URL(appCatalogUrl).origin;
 
            console.log(

              "Requesting SharePoint access token..."

            );
 
            const tokenResponse =

              await credential.getToken(

                `${sharePointUrl}/.default`

              );
 
            if (!tokenResponse ||

                !tokenResponse.token) {
 
              throw new Error(

                "Unable to obtain SharePoint access token."

              );

            }
 
            console.log(

              "SharePoint access token acquired."

            );
 
            /*

             * The actual SharePoint App Catalog

             * upload/deployment API is called here.

             *

             * We will upload the .sppkg package

             * using the SharePoint REST endpoint.

             */
 
            const packageBuffer =

              fs.readFileSync(packagePath);
 
            const uploadUrl =

              `${appCatalogUrl}/_api/web/`;
 
            console.log(

              "Uploading SPFx package..."

            );
 
            /*

             * Deployment API implementation

             * goes here.

             */
 
            console.log(

              "Package size:",

              packageBuffer.length,

              "bytes"

            );
 
            console.log(

              "SPFx deployment script completed."

            );

          }
 
          main()

            .catch(error => {

              console.error(

                "SPFx deployment failed:"

              );
 
              console.error(error);
 
              process.exit(1);

            });
 
          EOF

        env:

          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

          SP_APP_CATALOG_URL: ${{ vars.SP_APP_CATALOG_URL }}
 
      # ----------------------------------------------------

      # Deploy

      # ----------------------------------------------------

      - name: Deploy SPFx package

        run: node deploy-spfx.js

        env:

          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

          SP_APP_CATALOG_URL: ${{ vars.SP_APP_CATALOG_URL }}
 
