name: SPFx DEV CI/CD

on:
  push:
    branches:
      - Dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: DEV
    
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'
          cache: 'npm'

      - name: Verify DEV Client ID
        shell: bash
        run: |
          if [ -z "$CLIENT_ID" ]; then
            echo "CLIENT_ID is NOT available"
            exit 1
          else
            echo "CLIENT_ID is available"
          fi
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}

      - name: Generate DEV config
        shell: bash
        run: |
          cat > src/webparts/userAccessManagement/config.ts <<EOF
          export const appConfig = {
            clientId: "${CLIENT_ID}"
          };
          EOF
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}

      - name: Verify generated config
        shell: bash
        run: |
          if grep -q 'clientId: ""' src/webparts/userAccessManagement/config.ts; then
            echo "ERROR: Client ID was not generated"
            exit 1
          else
            echo "DEV config contains a Client ID"
          fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Login
        run: |
         az account show

      - name: Find App Catalog Library
        run: |
          az rest \
            --method GET \
            --url "https://graph.microsoft.com/v1.0/sites/acuvatehyd.sharepoint.com:/sites/Al-masdar:/drives"


      - name: Install dependencies
        run: npm ci

      - name: Build SPFx solution
        run: npx gulp bundle

      - name: Package SPFx solution
        run: npx gulp package-solution --ship

      - name: Setup Node.js 20 for Microsoft 365 CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install CLI for Microsoft 365
        run: npm install -g @pnp/cli-microsoft365

      - name: Check Microsoft 365 CLI version
        run: m365 --version

      - name: Login to Microsoft 365 CLI
        run: |
          m365 login \
            --authType federatedIdentity \
            --appId "${{ vars.AZURE_CLIENT_ID }}" \
            --tenant "${{ vars.AZURE_TENANT_ID }}"
            
      - name: Verify Microsoft 365 CLI login
        run: |
          m365 status

      - name: Verify App Catalog access
        run: |
          m365 request \
            --url "https://graph.microsoft.com/v1.0/drives/b!A8no5pybkEO2M0GpblrVMYeizo7N2bhFuIuCagwelrW8cLc5PKvXTLdmIrJBsb5G/root/children" \
            --method get

      - name: Locate SPFx package
        shell: bash
        run: |
          echo "Searching for SPFx package..."
          find . -type f -name "*.sppkg" -print

      - name: Upload SPFx package to DEV App Catalog
        run: |
          m365 request \
            --url "https://graph.microsoft.com/v1.0/drives/b!A8no5pybkEO2M0GpblrVMYeizo7N2bhFuIuCagwelrW8cLc5PKvXTLdmIrJBsb5G/root:/user-access-management.sppkg:/content" \
            --method put \
            --file "./sharepoint/solution/user-access-management.sppkg"
      - name: Verify SPFx package in App Catalog
        run: |
          m365 request \
            --url "https://graph.microsoft.com/v1.0/drives/b!A8no5pybkEO2M0GpblrVMYeizo7N2bhFuIuCagwelrW8cLc5PKvXTLdmIrJBsb5G/root:/user-access-management.sppkg" \
            --method get

      - name: Check SharePoint App Catalog
        run: |
          m365 spo app list \
            --appCatalogScope sitecollection \
            --appCatalogUrl "https://acuvatehyd.sharepoint.com/sites/Al-masdar/AppCatalog"


